name: Refresh 13F holdings

on:
  schedule:
    # Monday 13:30 UTC. The SEC posts a new quarterly set after 13F deadlines;
    # a weekly check picks that up without polling EDGAR every day.
    - cron: "30 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-13f
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the SEC Form 13F data set
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python3 scripts/fetch_13f.py

      - name: Open a pull request when holdings change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data/holders.json; then
            echo "Holdings JSON is unchanged."
            exit 0
          fi
          branch="data/13f-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add public/data/holders.json
          git commit -m "Update TSLA 13F holdings from the SEC data set"
          git push --force-with-lease -u origin "$branch"
          existing="$(gh pr list --head "$branch" --base main --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "Updated existing pull request #$existing"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update TSLA 13F holdings" \
            --body "Weekly refresh of SEC Form 13F holdings for CUSIP 88160R101. The JSON is generated by scripts/fetch_13f.py from the newest data set listed on the SEC Form 13F data sets page. Review the diff before merging. Rows can double-count shares reported by both a parent and a sub-adviser."
